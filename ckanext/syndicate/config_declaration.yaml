version: 1
groups:
  - annotation: ckanext-syndicate
    options:
      - key: ckanext.syndicate.sync_on_changes
        type: bool
        default: true
        required: true
        description: Enable synchronization on change

      - key: ckanext.syndicate.queue.name
        default: default
        required: true
        description: The name of the queue to use for syndication jobs
